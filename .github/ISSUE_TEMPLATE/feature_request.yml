name: 功能建议
description: 提出新功能或改进
labels: [enhancement]

body:
  - type: checkboxes
    attributes:
      label: 提交前请确认
      options:
        - label: 我搜索过已有 Issue，没有找到相同建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 先说场景，再说方案 —— 不然很难判断这个功能值不值得做
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的实现方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其它办法
