name: Bug 反馈
description: 报告错误或与预期不符的行为
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        为了能定位问题，请尽量完整填写下面的信息。日志几乎总是最关键的一项。

  - type: checkboxes
    attributes:
      label: 提交前请确认
      options:
        - label: 我搜索过已有 Issue，没有找到相同问题
          required: true
        - label: 我使用的是 Releases 里的 APK 或 Actions 构建产物，不是自行改动过的版本
          required: true
        - label: 我的设备是 arm64-v8a
          required: true

  - type: input
    id: version
    attributes:
      label: DSH-Folk 版本
      description: 见 设置 → 关于，或 APK 文件名里的短 commit
      placeholder: 0.1.0 (a29a320)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: Pixel 8 / Android 15 / 无 root
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: 问题出现在哪一步
      options:
        - 安装 / 启动应用
        - 下载运行时
        - 启动 DSH（proot / proroot）
        - 打开 Web UI
        - 终端
        - 插件 / 插件商店
        - 配置备份 / 恢复
        - 权限（root / Shizuku / 无线 ADB）
        - 其它
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际的行为与复现步骤
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 启动日志
      description: 首页启动日志面板右上角有复制按钮，粘贴到这里
      render: text
