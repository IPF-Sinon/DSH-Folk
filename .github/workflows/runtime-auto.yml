name: Auto-build beta DSH runtime

# 自动跟进上游 @deepseek-ai/dsh 的新版本，构建**测试版**运行时。
#
# 为什么需要它：运行时是把某个具体版本的 dsh 装进 rootfs 的结果。上游一发新版，
# 存量用户要么手动去 Actions 点一次 runtime.yml，要么一直用旧运行时 —— 而新版 dsh 常常
# 带着「启动变慢」这类需要重新打包才能消化的变化（2026-11-07 就遇到过：dsh 新版加载要 54 秒，
# 旧运行时的 90 秒超时余量不够，被误判成 proroot 故障）。
#
# 边界：
#  - 只发 **beta** 通道（runtime-beta-latest），稳定通道仍由人手动决定；
#  - 同一个上游版本**不重复构建**：把已构建的版本记在 beta release 的 body 里，
#    下轮读出来比对（不想为此引入额外的 state 分支或外部存储）；
#  - 失败不重试不阻塞：这是后台保障，挂了下次定时还会再试。

on:
  schedule:
    # 每 6 小时看一次。上游发版不会那么频繁，而更密的话只是在空转 Actions 分钟数。
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the recorded version and rebuild anyway"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - name: Read latest upstream version
        id: upstream
        run: |
          set -euo pipefail
          V=$(npm view @deepseek-ai/dsh version)
          echo "upstream=$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Read the actually-built version from the published metadata
        id: last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **必须有 GH_REPO**：本 job 没有 checkout，gh 无法从 .git 推断要操作哪个仓库，
          # 会直接以 `fatal: not a git repository` 退出。这个 env 是它的唯一依据。
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # 版本从**已发布的 metadata.json** 里读（"dsh" 字段），而不是在 release body 里
          # 自己维护一个标记。差别是根本性的：
          #
          #  - metadata 是**构建产物自己写的**，它存在就代表那个版本真的构建成功了；
          #  - body 里的标记是 CI **在派发之后**写下的，它只代表"我点过按钮"。
          #
          # 上一版用 body 标记，于是构建失败时标记照样写进去，下一轮就判定"已构建"，
          # 那个上游版本从此再没人管 —— 而且不会有任何报错，只会静默落后。
          #
          # 顺带修掉一个更隐蔽的病：这个 job 没有 checkout，gh 无法推断仓库，
          # 而原来那句 `|| echo ""` 把 `fatal: not a git repository` 吞成了空 body，
          # 于是 last 永远是 none → 每 6 小时都判定"需要构建"→ 次次空转。
          #
          # 「还没有 release / 还没有 metadata」= 从没构建过，不是错误；
          # 其它任何失败都**要炸出来**，不能再被当成"从没构建过"。
          got=0
          for i in $(seq 1 10); do
            if gh release download runtime-beta-latest --pattern metadata.json --dir /tmp/rbmeta --clobber 2>/tmp/err; then
              got=1; break
            fi
            sleep 6
          done
          MARK=""
          if [ "$got" = "1" ] && [ -f /tmp/rbmeta/metadata.json ]; then
            MARK=$(node -e "try{console.log(JSON.parse(require(\"fs\").readFileSync(\"/tmp/rbmeta/metadata.json\",\"utf8\")).dsh||\"\")}catch(e){console.log(\"\")}")
          elif grep -qiE "not found|no assets|release not found" /tmp/err 2>/dev/null; then
            MARK=""
          else
            echo "读取 runtime-beta-latest 的 metadata 失败（原因不是 not found，本轮不猜）：" >&2
            cat /tmp/err >&2 || true
            exit 1
          fi
          echo "last=${MARK:-none}"
          echo "last=$MARK" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          UP="${{ steps.upstream.outputs.version }}"
          LAST="${{ steps.last.outputs.last }}"
          FORCE="${{ inputs.force }}"
          # 只有「上游版本变了」或「显式 force」才构建。
          # 用这一条而不是比较时间戳：版本号才是唯一有意义的事实。
          if [ "$FORCE" = "true" ] || [ "$UP" != "$LAST" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "决定构建：上游 $UP（上次 $LAST）"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "跳过：已是 $UP"
          fi
          echo "version=$UP" >> "$GITHUB_OUTPUT"

      - name: Summarize
        run: |
          {
            echo "### 自动运行时检查"
            echo
            echo "- 上游最新：`${{ steps.upstream.outputs.version }}`"
            echo "- 上次构建：`${{ steps.last.outputs.last }}`"
            echo "- 是否构建：`${{ steps.decide.outputs.build }}`"
          } >> "$GITHUB_STEP_SUMMARY"

  dispatch:
    needs: probe
    if: needs.probe.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger runtime build (beta channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 与 probe 同理：没有 checkout 就必须显式给仓库，否则 gh 报 not a git repository。
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.probe.outputs.version }}
        run: |
          set -euo pipefail
          gh workflow run runtime.yml --ref "${{ github.ref_name }}" \
            -f dsh_version="$VERSION" \
            -f channel=beta \
            -f flavor=full \
            -f arch=both \
            -f publish=true
          echo "已触发 runtime.yml：$VERSION（beta / full / both）"

      # 到这里就结束了 —— **不再在 release body 里写版本标记**。
      #
      # 上一版这么做，两个毛病都出在它身上：
      #  1. 标记是"我派发过"的记录，不是"构建成功了"的记录。构建失败照样写进去，
      #     下一轮就判定"已构建"并永久跳过该版本，且不报任何错。
      #  2. 它还会改坏 release 说明：body 拿不到时用空文件 grep，结果只写进一行标记。
      #
      # 现在**唯一的事实来源**是发布出来的 metadata.json（probe 每次去读）。
      # 构建失败 → metadata 还是旧的 → 下一轮自动重试。这才是想要的语义，
      # 而且不需要任何额外状态。
